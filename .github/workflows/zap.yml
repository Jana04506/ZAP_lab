name: ZAP Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flask
        run: pip install -r requirements.txt

      - name: Start Website
        run: |
          python app.py &
          sleep 10

      - name: Run ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000
          fail_action: false
